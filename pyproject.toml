[project]
name = "lang2recover"
version = "0.1.0"
description = "Language-guided RL recovery for VLA-style robot control."
requires-python = ">=3.10"
dependencies = [
    "mani_skill",
    "torch",
    "gymnasium",
    "numpy",
    "imageio",
    "imageio-ffmpeg",
    "matplotlib",
    "stable-baselines3",
    "tensorboard",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["src"]